name: Quader architecture verification

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  QUADER_VCPKG_BASELINE: d0c191d142b7bc048141ddfb618aa9ae5dba0233
  QUADER_OPENMESH_COMMIT: 5f016723f9f183770cffe5787a6f9f628e2914d8
  QUADER_FILAMENT_VERSION: 1.71.6
  QUADER_FILAMENT_SHA256: f56b7b2717eda5094179748687e57fa20c2f245a3203fdf1fe274dba37e21180
  QUADER_VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/build/vcpkg-binary-cache,readwrite
  VCPKG_FEATURE_FLAGS: manifests,binarycaching,versions

jobs:
  sdk-msvc:
    name: SDK-only (MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      QUADER_CI_BUILD_DIR: build/ci-sdk-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QUADER_VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-msvc-${{ env.QUADER_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-msvc-${{ env.QUADER_VCPKG_BASELINE }}-

      - name: Bootstrap pinned vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:QUADER_VCPKG_BINARY_CACHE | Out-Null
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-$env:QUADER_VCPKG_BASELINE"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin $env:QUADER_VCPKG_BASELINE
          git -C $root checkout --detach FETCH_HEAD
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Configure no-Filament SDK graph
        shell: pwsh
        run: |
          $toolchain = Join-Path '${{ steps.vcpkg.outputs.root }}' "scripts/buildsystems/vcpkg.cmake"
          cmake `
            -S . `
            -B $env:QUADER_CI_BUILD_DIR `
            -G "Visual Studio 18 2026" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DVCPKG_MANIFEST_FEATURES=tests `
            -DQUADER_BUILD_NATIVE_APP=OFF `
            -DQUADER_BUILD_TESTS=ON `
            -DQUADER_USE_OPENMESH_TOPOLOGY=OFF `
            -DQUADER_ALLOW_EXTERNAL_OPENMESH_FETCH=OFF `
            -DQUADER_OPENMESH_SOURCE_DIR=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build SDK verification owners
        shell: pwsh
        run: |
          cmake --build $env:QUADER_CI_BUILD_DIR `
            --config Debug `
            --target quader_guardrail_tests quader_modeling_sdk_consumer_tests `
                     quader_sdk_example_mesh_operation `
                     quader_sdk_example_qdr_roundtrip `
                     quader_sdk_example_session_preview `
            -- /m /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all registered SDK-only checks
        shell: pwsh
        run: |
          ctest --test-dir $env:QUADER_CI_BUILD_DIR `
            -C Debug `
            --output-on-failure `
            --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  sdk-portable:
    name: SDK-only (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            id: gcc
            cxx: g++
          - name: Clang
            id: clang
            cxx: clang++
    env:
      QUADER_CI_BUILD_DIR: build/ci-sdk-${{ matrix.id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QUADER_VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ env.QUADER_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ env.QUADER_VCPKG_BASELINE }}-

      - name: Bootstrap pinned vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUADER_VCPKG_BINARY_CACHE"
          root="$RUNNER_TEMP/vcpkg-$QUADER_VCPKG_BASELINE"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin "$QUADER_VCPKG_BASELINE"
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Configure portable SDK graph
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B "$QUADER_CI_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.root }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DQUADER_BUILD_NATIVE_APP=OFF \
            -DQUADER_BUILD_TESTS=ON \
            -DQUADER_USE_OPENMESH_TOPOLOGY=OFF \
            -DQUADER_ALLOW_EXTERNAL_OPENMESH_FETCH=OFF \
            -DQUADER_OPENMESH_SOURCE_DIR=

      - name: Build portable SDK verification owners
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$QUADER_CI_BUILD_DIR" --target \
            quader_guardrail_tests \
            quader_modeling_sdk_consumer_tests \
            quader_sdk_example_mesh_operation \
            quader_sdk_example_qdr_roundtrip \
            quader_sdk_example_session_preview

      - name: Run all registered portable SDK checks
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$QUADER_CI_BUILD_DIR" \
            --output-on-failure \
            --no-tests=error

  sdk-sanitizers:
    name: SDK-only (Clang ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QUADER_CI_BUILD_DIR: build/ci-sdk-sanitizers
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QUADER_VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-clang-sanitizers-${{ env.QUADER_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-clang-sanitizers-${{ env.QUADER_VCPKG_BASELINE }}-

      - name: Bootstrap pinned vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUADER_VCPKG_BINARY_CACHE"
          root="$RUNNER_TEMP/vcpkg-$QUADER_VCPKG_BASELINE"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin "$QUADER_VCPKG_BASELINE"
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Configure sanitized SDK graph
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B "$QUADER_CI_BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.root }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DQUADER_BUILD_NATIVE_APP=OFF \
            -DQUADER_BUILD_TESTS=ON \
            -DQUADER_ENABLE_PCH=OFF \
            -DQUADER_USE_OPENMESH_TOPOLOGY=OFF \
            -DQUADER_ALLOW_EXTERNAL_OPENMESH_FETCH=OFF \
            -DQUADER_OPENMESH_SOURCE_DIR=

      - name: Build and run sanitized SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$QUADER_CI_BUILD_DIR" \
            --target quader_modeling_sdk_consumer_tests
          ctest --test-dir "$QUADER_CI_BUILD_DIR" \
            --output-on-failure \
            --no-tests=error \
            -R '^quader_modeling_sdk_consumer_tests$'

  native-windows:
    name: Native editor (MSVC + Filament)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      QUADER_CI_BUILD_DIR: build/ci-native-windows
      QUADER_FILAMENT_ARCHIVE: build/ci-artifacts/filament-v1.71.6-windows.tgz

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QUADER_VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-native-${{ env.QUADER_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-native-${{ env.QUADER_VCPKG_BASELINE }}-

      - name: Restore pinned Filament archive
        uses: actions/cache@v4
        with:
          path: ${{ env.QUADER_FILAMENT_ARCHIVE }}
          key: filament-windows-v${{ env.QUADER_FILAMENT_VERSION }}-${{ env.QUADER_FILAMENT_SHA256 }}

      - name: Restore pinned OpenMesh source
        uses: actions/cache@v4
        with:
          path: build/ci-deps/openmesh
          key: openmesh-${{ env.QUADER_OPENMESH_COMMIT }}

      - name: Bootstrap pinned vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:QUADER_VCPKG_BINARY_CACHE | Out-Null
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-$env:QUADER_VCPKG_BASELINE"
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin $env:QUADER_VCPKG_BASELINE
          git -C $root checkout --detach FETCH_HEAD
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Provision checksum-pinned Filament SDK
        id: filament
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:GITHUB_WORKSPACE $env:QUADER_FILAMENT_ARCHIVE
          New-Item -ItemType Directory -Force -Path (Split-Path $archive -Parent) | Out-Null
          if (-not (Test-Path -LiteralPath $archive)) {
            $uri = "https://github.com/google/filament/releases/download/v$env:QUADER_FILAMENT_VERSION/filament-v$env:QUADER_FILAMENT_VERSION-windows.tgz"
            Invoke-WebRequest -Uri $uri -OutFile $archive
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:QUADER_FILAMENT_SHA256) {
            throw "Filament archive checksum mismatch: $actual"
          }
          $extract = Join-Path $env:GITHUB_WORKSPACE "build/ci-deps/filament"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = Get-ChildItem -LiteralPath $extract -Recurse -File -Filter Engine.h |
            Where-Object { $_.FullName.Replace('/', '\') -like '*\include\filament\Engine.h' } |
            Select-Object -First 1
          if ($null -eq $engine) { throw "Extracted Filament SDK has no Engine.h." }
          $sdkRoot = $engine.Directory.Parent.Parent.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot "bin/matc.exe"))) {
            throw "Extracted Filament SDK has no bin/matc.exe."
          }
          "root=$sdkRoot" >> $env:GITHUB_OUTPUT

      - name: Provision pinned OpenMesh source
        id: openmesh
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:GITHUB_WORKSPACE "build/ci-deps/openmesh"
          if (-not (Test-Path -LiteralPath (Join-Path $root ".git"))) {
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            git init $root
            git -C $root remote add origin https://gitlab.vci.rwth-aachen.de:9000/OpenMesh/OpenMesh.git
            git -C $root fetch --depth 1 origin $env:QUADER_OPENMESH_COMMIT
            git -C $root checkout --detach FETCH_HEAD
            git -C $root submodule update --init --recursive --depth 1
          }
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUADER_OPENMESH_COMMIT) {
            throw "OpenMesh source revision mismatch: $actual"
          }
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Configure complete native graph
        shell: pwsh
        run: |
          $toolchain = Join-Path '${{ steps.vcpkg.outputs.root }}' "scripts/buildsystems/vcpkg.cmake"
          cmake `
            -S . `
            -B $env:QUADER_CI_BUILD_DIR `
            -G "Visual Studio 18 2026" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQUADER_BUILD_NATIVE_APP=ON `
            -DQUADER_BUILD_TESTS=ON `
            -DQUADER_USE_OPENMESH_TOPOLOGY=ON `
            -DQUADER_ALLOW_EXTERNAL_OPENMESH_FETCH=OFF `
            "-DQUADER_OPENMESH_SOURCE_DIR=${{ steps.openmesh.outputs.root }}" `
            "-DFILAMENT_SDK_ROOT=${{ steps.filament.outputs.root }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native app and all test owners
        shell: pwsh
        run: |
          cmake --build $env:QUADER_CI_BUILD_DIR `
            --config Debug `
            --target quader_guardrail_tests `
                     quader_modeling_sdk_consumer_tests `
                     quader_modeling_sdk_parity_tests `
                     quader_modeling_domain_tests `
                     quader_tests `
                     quader `
            -- /m /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete native CTest inventory
        shell: pwsh
        run: |
          ctest --test-dir $env:QUADER_CI_BUILD_DIR `
            -C Debug `
            --output-on-failure `
            --no-tests=error `
            --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
